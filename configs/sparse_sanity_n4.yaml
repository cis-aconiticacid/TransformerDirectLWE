# Sparse sanity at n=4 — validates L0 annealing + hard-prune eval end-to-end
# on CPU before n=16 runs on GPU.
out_dir: runs/R000f_lwe_sparse_n4

n: 4
q: 7
hamming: 2
e_bound: 1
mode: B
fixed_s_seed: 7

d_model: 64
d_ff: 128
n_heads: 4
n_layers: 2

seed: 42
steps: 12000
batch_size: 128
eval_size: 2000
lr: 3.0e-3
weight_decay: 0.0
warmup: 100
clip: 1.0
log_every: 500
eval_every: 500

use_sparsity: true
constant_lambda: false
lambda_warmup_steps: 3000
lambda_ramp_steps: 6000
# n=4 toy task has ~180k gated params. Normalized density ∈ [0,1],
# so lambda_max=1.0 is CE-scale reasonable. Expect final hard density < 1/100
# (can't reliably hit 1/1000 on this tiny task).
lambda_max: 1.0
