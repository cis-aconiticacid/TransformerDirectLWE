# Mode A generic decoder at n=4 — the *real* paper claim (model learns the
# algorithm, not a specific key). s is randomized every sample and fed as input.
out_dir: runs/R000g_lwe_modeA_n4

n: 4
q: 7
hamming: 2
e_bound: 1
mode: A

d_model: 64
d_ff: 128
n_heads: 4
n_layers: 2

seed: 42
steps: 6000
batch_size: 128
eval_size: 2000
lr: 3.0e-3
weight_decay: 0.0
warmup: 100
clip: 1.0
log_every: 300
eval_every: 300

use_sparsity: false
