# Architecture test: 4-layer, d=256, n=8. If this groks, the n=8 barrier is
# about depth/width not task difficulty.
out_dir: runs/R010_modeB_n8_4L_d256

n: 8
q: 11
hamming: 3
e_bound: 1
mode: B
fixed_s_seed: 7

d_model: 256
d_ff: 1024
n_heads: 8
n_layers: 4

seed: 42
steps: 15000
batch_size: 128
eval_size: 2000
lr: 1.0e-3
weight_decay: 0.0
warmup: 200
clip: 1.0
log_every: 500
eval_every: 500

use_sparsity: false
